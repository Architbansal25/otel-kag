server:
  port: 8084

spring:
  application:
    name: broker
  artemis:
    mode: embedded
    embedded:
      enabled: true
      queues: order.events

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    display-request-duration: true
