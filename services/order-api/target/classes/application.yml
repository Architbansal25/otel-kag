server:
  port: 8081

spring:
  application:
    name: order-api
  artemis:
    mode: native
    # Fail fast when the broker is gone instead of retrying inside every request.
    broker-url: tcp://localhost:61616?initialConnectAttempts=1&reconnectAttempts=0&retryInterval=100

demo:
  inventory-url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    display-request-duration: true
