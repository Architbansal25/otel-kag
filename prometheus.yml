# Prometheus scrape config. Pulls metrics that the OTel Collector exposes,
# making them available at http://prometheus:9090 for the kag-engine service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics exported by the OpenTelemetry Collector (app metrics via OTLP).
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus self-monitoring.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
